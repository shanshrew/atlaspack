[package]
name = "swc-noop-plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
swc_atoms = "5.0.0"
swc_common = "11.0.3"
swc_core = { version = "=26.3.4", default-features = false, features = ["common", "ecma_plugin_transform"] }
swc_ecma_ast = "11.0.0"
swc_ecma_parser = "14.0.1"
swc_ecma_utils = "15.0.1"
swc_ecma_visit = "11.0.0"
swc_ecma_transforms_base = "15.1.1"
swc_plugin_macro = { version = "1.1.0", optional = true }
swc_plugin = { version = "1.0.1", optional = true }
swc_ecma_transforms_testing = { version = "18.0.0", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
once_cell = "1.19"
rustc-hash = "1.1"
serde = "=1.0.223"

[dev-dependencies]
swc_ecma_codegen = "13.2.0"

[features]
default = []
# Enable this when building the actual plugin for wasm runtime
plugin = ["swc_plugin_macro", "swc_plugin"]
